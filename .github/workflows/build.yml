name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source commit to package.
        required: true
        type: string
      release_tag:
        description: Release tag matching Cargo.toml.
        required: true
        type: string
      attest:
        description: Generate release provenance attestations.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build and smoke-test release archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-release.sh release

      - name: Generate build provenance attestation
        if: inputs.attest
        uses: actions/attest@v4
        with:
          subject-path: release/*.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: panoptes-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
