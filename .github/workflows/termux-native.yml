name: Native Termux smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-aarch64:
    # A runner registered from the Termux app with all three labels. This is the
    # real Android/Bionic gate; termux-docker in CI is useful but cannot emulate
    # Android's kernel and complete public-library surface.
    runs-on: [self-hosted, termux, ARM64]
    timeout-minutes: 60
    steps:
      - name: Fetch exact revision without Node-based actions
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD

      - name: Native Android build and isolated install smoke
        run: |
          set -eu
          pkg install -y rust clang make git pkg-config jq
          export CARGO_BUILD_JOBS=1
          cargo test --workspace --all-targets --locked
          prefix="$TMPDIR/panoptes-prefix-$GITHUB_RUN_ID"
          PANOPTES_GIT_SHA="$GITHUB_SHA" cargo install --path . --locked --root "$prefix"
          bash scripts/smoke.sh "$prefix/bin/panoptes"
