name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source commit to validate.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Check release scripts
        run: |
          bash -n scripts/package-release.sh
          bash -n scripts/smoke.sh

      - name: Build CLI
        run: cargo build --workspace --locked

      - name: Exercise CLI and MCP
        run: bash scripts/smoke.sh target/debug/panoptes

  termux-container:
    name: check (Termux Bionic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Build and run in Termux Bionic userland
        run: |
          set -euxo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" termux/termux-docker:latest bash -lc '
            set -eu
            pkg update -y
            pkg install -y rust clang make git pkg-config jq
            build_dir=$(mktemp -d)
            cp -R /workspace/. "$build_dir/"
            cd "$build_dir"
            export CARGO_BUILD_JOBS=1
            cargo test --workspace --all-targets --locked
            cargo build --workspace --locked
            bash scripts/smoke.sh target/debug/panoptes
          '
