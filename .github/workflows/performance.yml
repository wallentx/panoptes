name: Performance

on:
  workflow_dispatch:
    inputs:
      files:
        description: Files in the single-repository fixture
        required: true
        default: '400'
        type: string
      build-runs:
        description: Cold, warm, and one-file build repetitions
        required: true
        default: '3'
        type: string
      query-runs:
        description: Query and MCP repetitions
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install profiling tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 strace

      - name: Build release binary
        run: cargo build --workspace --release --locked

      - name: Run benchmark matrix
        env:
          PANOPTES_BENCH_FILES: ${{ inputs.files }}
          PANOPTES_BENCH_BUILD_RUNS: ${{ inputs.build-runs }}
          PANOPTES_BENCH_QUERY_RUNS: ${{ inputs.query-runs }}
        run: scripts/benchmark.sh --output "$RUNNER_TEMP/panoptes-benchmark"

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panoptes-performance-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/panoptes-benchmark
          if-no-files-found: error
          retention-days: 30
